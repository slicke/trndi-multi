name: Build

on:
  push:
    branches: [main]
  pull_request:

# Pushes to main run one at a time: the build number is decided before the
# binaries are built (they carry it, for the update check), so two runs
# deciding at once would both claim the same number and the later one would
# fail to tag. Pull requests are grouped per PR and superseded by a new push.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# The version job picks the number first; then one job per platform, each
# ending in an artifact named after the platform; publish then turns every
# push to main that built green into a rolling build-<N> release, as
# trndi-cli does. The Lazarus toolchain comes from the same places as
# Trndi's own CI, pinned to the Lazarus release files on SourceForge on
# every platform: the .debs through the vendored setup-lazarus action on
# Linux, the installer on Windows and the FPC dmg plus Lazarus zip on macOS.
jobs:
  # ===================== VERSION =====================
  # The number the binaries are stamped with (src/trndimulti.buildinfo.pp, through the
  # write-buildinfo action) and the release is tagged with: next after the
  # highest build-<N> tag, from 100, for a push to main; PR-<n> for a pull
  # request. `prev` is the tag before it, for the release notes.
  version:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      num: ${{ steps.ver.outputs.num }}
      prev: ${{ steps.ver.outputs.prev }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history *and* tags, for the build counter
      - id: ver
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "num=PR-${{ github.event.pull_request.number }}" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          LATEST=$(git tag | grep -E '^build-[0-9]+$' | sed 's/^build-//' | sort -n | tail -1)
          echo "num=$(( ${LATEST:-99} + 1 ))" >> "$GITHUB_OUTPUT"
          echo "prev=${LATEST:+build-$LATEST}" >> "$GITHUB_OUTPUT"

  linux:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            # Preview image: libqt6pas6/-dev only entered the Ubuntu archive
            # in 25.10, so ubuntu-latest (24.04) cannot build the Qt6 LCL.
            runner: ubuntu-26.04
            # No toolchain URLs: amd64 inherits the pin owned by the
            # vendored setup-lazarus action.
          - arch: arm64
            runner: ubuntu-26.04-arm
            fpc_laz_url: "https://sourceforge.net/projects/lazarus/files/Lazarus%20Linux%20arm64%20DEB/Lazarus%204.8/fpc-laz_3.2.3-240813_arm64.deb/download"
            fpc_src_url: "https://sourceforge.net/projects/lazarus/files/Lazarus%20Linux%20arm64%20DEB/Lazarus%204.8/fpc-src_3.2.3-240813_arm64.deb/download"
            laz_url: "https://sourceforge.net/projects/lazarus/files/Lazarus%20Linux%20arm64%20DEB/Lazarus%204.8/lazarus-project_4.8.0-0_arm64.deb/download"
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      # The submodule carries Trndi's composite action, so the toolchain pin
      # is Trndi's and moves when the submodule does.
      - name: Install Lazarus/FPC toolchain
        uses: ./vendor/trndi/.github/actions/setup-lazarus
        with:
          fpc_laz_url: ${{ matrix.fpc_laz_url }}
          fpc_src_url: ${{ matrix.fpc_src_url }}
          laz_url: ${{ matrix.laz_url }}

      - uses: ./.github/actions/write-buildinfo
        with:
          build_number: ${{ needs.version.outputs.num }}

      - name: Build
        run: make

      # A GUI app has no --help to call, but it can run headless on Qt's
      # offscreen platform: with no settings it must come up on the "no
      # accounts" screen and stay up, so the timeout expiring (124) is the
      # pass and any other exit means it crashed at start.
      - name: Smoke test
        run: |
          set +e
          QT_QPA_PLATFORM=offscreen timeout 10 ./bin/trndi-multi
          code=$?
          set -e
          test "$code" -eq 124

      - name: Stage binary
        run: cp bin/trndi-multi trndi-multi-linux-${{ matrix.arch }}
      - uses: actions/upload-artifact@v4
        with:
          name: trndi-multi-linux-${{ matrix.arch }}
          path: trndi-multi-linux-${{ matrix.arch }}

  windows:
    needs: version
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      # Same installer Trndi's CI uses; it puts lazbuild at C:\Lazarus, which
      # make.ps1 already looks for. curl.exe rather than the Invoke-WebRequest
      # alias because SourceForge content-negotiates on User-Agent; the MZ
      # check makes a mirror that answers with an HTML page fail here rather
      # than at install.
      - name: Install Lazarus
        shell: pwsh
        run: |
          curl.exe -L --fail --retry 5 --retry-delay 5 --retry-all-errors -o lazarus.exe "https://sourceforge.net/projects/lazarus/files/Lazarus%20Windows%2064%20bits/Lazarus%204.8/lazarus-4.8-fpc-3.2.2-win64.exe/download"
          $fs = [System.IO.File]::OpenRead('lazarus.exe')
          $mz = New-Object byte[] 2
          $null = $fs.Read($mz, 0, 2)
          $fs.Close()
          if (($mz[0] -ne 0x4D) -or ($mz[1] -ne 0x5A)) {
            throw 'lazarus.exe is not a Windows executable - the mirror likely returned a web page.'
          }
          Start-Process '.\lazarus.exe' -ArgumentList '/VERYSILENT','/SP-','/NORESTART','/DIR=C:\Lazarus' -Wait

      - uses: ./.github/actions/write-buildinfo
        with:
          build_number: ${{ needs.version.outputs.num }}

      - name: Build
        shell: pwsh
        run: .\make.ps1

      # WinHTTP transport and registry settings through Trndi's Windows
      # native: the exe has no runtime dependencies beyond Windows itself.
      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory pkg | Out-Null
          Copy-Item bin\trndi-multi.exe pkg\
          Copy-Item LICENSE pkg\LICENSE.txt
          Compress-Archive -Path pkg\* -DestinationPath trndi-multi-windows-x64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: trndi-multi-windows-x64
          path: trndi-multi-windows-x64.zip

  macos:
    needs: version
    runs-on: macos-14
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      # The official Lazarus release files, as Trndi's CI installs them,
      # rather than MacPorts: MacPorts rebuilds its fpc port on its own
      # schedule (3.2.2_7 on 2026-09-17 broke fpcunit for Trndi), and the
      # pin keeps the compiler the same as a developer's. Bump the two URLs
      # together with Trndi's pin and the Linux/Windows ones.
      - name: Install Lazarus/FPC toolchain
        env:
          FPC_DMG_URL: https://sourceforge.net/projects/lazarus/files/Lazarus%20macOS%20aarch64/Lazarus%204.8/fpc-3.2.4rc1a.intelarm64-macosx.dmg/download
          LAZ_ZIP_URL: https://sourceforge.net/projects/lazarus/files/Lazarus%20macOS%20aarch64/Lazarus%204.8/lazarus-darwin-aarch64-4.8.zip/download
          HOMEBREW_NO_AUTO_UPDATE: "1"
          HOMEBREW_NO_INSTALL_CLEANUP: "1"
        run: |
          set -euo pipefail
          # The FPC installer wants the Xcode command line tools; the runner
          # image ships them. Show which SDK the compiler will pick up.
          xcode-select -p
          xcrun --show-sdk-path

          CURL_RETRY="--retry 5 --retry-delay 5 --retry-all-errors"
          # Outside the checkout, so no installer can ever be picked up
          # beside the build's own files (Trndi's build-249 shipped its
          # fpc.dmg and lazarus.zip as release assets that way).
          DL="$RUNNER_TEMP/toolchain"
          mkdir -p "$DL"
          curl -fsSL $CURL_RETRY -o "$DL/fpc.dmg" "$FPC_DMG_URL"
          curl -fsSL $CURL_RETRY -o "$DL/lazarus.zip" "$LAZ_ZIP_URL"

          # FPC: a .pkg inside the dmg; installs under /usr/local and writes
          # /etc/fpc.cfg.
          MNT="$(mktemp -d)"
          hdiutil attach -nobrowse -readonly -mountpoint "$MNT" "$DL/fpc.dmg"
          PKG="$(find "$MNT" -maxdepth 2 -name '*.pkg' | head -n1)"
          [ -n "$PKG" ] || { echo "No .pkg found in the FPC dmg" >&2; ls -R "$MNT" >&2; exit 1; }
          sudo installer -pkg "$PKG" -target /
          hdiutil detach "$MNT"

          # gmake and create-dmg (dist/macos.sh) from Homebrew.
          brew install make create-dmg

          # Lazarus at /Applications/lazarus, where the Makefile also looks.
          xattr -cr "$DL/lazarus.zip"
          EXTRACT="$(mktemp -d)"
          unzip -q "$DL/lazarus.zip" -d "$EXTRACT"
          LB="$(find "$EXTRACT" -maxdepth 3 -name lazbuild -type f | head -n1)"
          [ -n "$LB" ] || { echo "lazbuild not found in the Lazarus zip" >&2; find "$EXTRACT" -maxdepth 2 >&2; exit 1; }
          sudo rm -rf /Applications/lazarus
          sudo mv "$(dirname "$LB")" /Applications/lazarus
          sudo xattr -cr /Applications/lazarus

          # The zip's lazarus.cfg points at a portable config dir with no
          # environmentoptions.xml in it (the IDE writes that on first
          # start), so a bare lazbuild falls back to /Developer/lazarus/ and
          # stops. Write both with absolute paths, as Trndi's CI does.
          GMAKE="$(brew --prefix)/bin/gmake"
          sudo mkdir -p /Applications/lazarus/config
          printf -- '--pcp=/Applications/lazarus/config\n--lazarusdir=/Applications/lazarus\n' \
            | sudo tee /Applications/lazarus/lazarus.cfg >/dev/null
          sudo tee /Applications/lazarus/config/environmentoptions.xml >/dev/null <<'XML'
          <?xml version="1.0" encoding="UTF-8"?>
          <CONFIG>
            <EnvironmentOptions>
              <Version Value="112" Lazarus="4.8"/>
              <LazarusDirectory Value="/Applications/lazarus/"/>
              <CompilerFilename Value="/usr/local/bin/fpc"/>
              <FPCSourceDirectory Value="$(LazarusDir)/fpc/$(FPCVer)/sources/"/>
              <MakeFilename Value="__GMAKE__"/>
              <TestBuildDirectory Value="$ENV(TMPDIR)"/>
            </EnvironmentOptions>
          </CONFIG>
          XML
          sudo sed -i '' -e 's|__GMAKE__|'"$GMAKE"'|' -e 's/^          //' \
            /Applications/lazarus/config/environmentoptions.xml
          sudo chown -R "$(id -u):$(id -g)" /Applications/lazarus/config

          # lazbuild, fpc, gmake and create-dmg for the steps below.
          echo "/Applications/lazarus" >> "$GITHUB_PATH"
          echo "/usr/local/bin" >> "$GITHUB_PATH"
          echo "$(brew --prefix)/bin" >> "$GITHUB_PATH"

          export PATH="/Applications/lazarus:/usr/local/bin:$(brew --prefix)/bin:$PATH"
          fpc -iV
          lazbuild --version
          gmake --version | head -n1
          command -v create-dmg

      # A bare Cocoa binary has no bundle to be activated through, so the
      # window never comes to the front. dist/macos.sh wraps it in
      # "Trndi Multi.app" (Finder icon from the committed TrndiMulti.png, DMG
      # background from the vendored Trndi) and packs that into a
      # drag-to-Applications .dmg, as Trndi's CI does.
      # Runs on PRs too, so packaging changes get tested; only main publishes.
      - uses: ./.github/actions/write-buildinfo
        with:
          build_number: ${{ needs.version.outputs.num }}

      # CFBundleVersion must be numeric, so a PR build falls back to the run
      # number there; the binary itself still says PR-<n>.
      - name: Build and package
        env:
          BUILD_NUMBER: ${{ github.event_name == 'push' && needs.version.outputs.num || github.run_number }}
        run: |
          set -euo pipefail
          gmake
          ./dist/macos.sh
          mv dist/trndi-multi-macos-arm64.dmg .
      - uses: actions/upload-artifact@v4
        with:
          name: trndi-multi-macos-arm64
          path: trndi-multi-macos-arm64.dmg

  # ===================== RELEASE =====================
  # Rolling releases as trndi-cli does them: every push to main that builds
  # green on every platform becomes tag build-<N> (from 100) with the
  # artifacts as release assets. The site's download links point at
  # releases/latest/download/<asset>, so the asset names above are an API.
  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [version, linux, windows, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history, for the changelog

      # Not into dist/: that is a directory of the checkout, and the
      # dist/*/* below would publish its files (dist/linux's desktop entry
      # went out with build-112) beside the artifacts.
      - uses: actions/download-artifact@v4
        with:
          path: release-assets

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NUM=${{ needs.version.outputs.num }}
          PREV=${{ needs.version.outputs.prev }}
          # Changelog: the commit subjects since the previous build tag.
          # Commits land on main directly rather than through PRs, so
          # gh's --generate-notes would come out empty; the one-line
          # imperative subjects read well enough as a list on their own.
          # The first release has no previous tag and lists everything.
          LOG=$(git log --no-merges --format='- %s (%h)' "${PREV:+$PREV..}HEAD")
          {
            echo "## Changes${PREV:+ since $PREV}"
            echo
            echo "${LOG:-- (no new commits)}"
            echo
            echo "Automated build of ${GITHUB_SHA}. Accounts come from Trndi's settings — see README.md. Linux needs libQt6Pas (libqt6pas6 / qt6pas) and libcurl installed; the macOS dmg is unsigned, see its README.txt."
          } > notes.md
          # No --target: tag whatever main's HEAD is at publish time, as
          # trndi-cli does; targeting $GITHUB_SHA 403s once a newer push
          # has landed.
          gh release create "build-${NUM}" \
            --title "Build ${NUM}" \
            --notes-file notes.md \
            release-assets/*/*
